spring.application.name=api-gateway

server.port=8080

# ==============================
# Eureka Server
# ==============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# ==============================
# Restaurant Service
# ==============================
spring.cloud.gateway.routes[0].id=restaurant-service
spring.cloud.gateway.routes[0].uri=lb://restaurant-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/restaurants/**


# ==============================
# Order Service
# ==============================
spring.cloud.gateway.routes[1].id=order-service
spring.cloud.gateway.routes[1].uri=lb://order-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/orders/**


# ==============================
# Payment Service
# ==============================
spring.cloud.gateway.routes[2].id=payment-service
spring.cloud.gateway.routes[2].uri=lb://payment-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/payments/**


# ==============================
# JWT Configuration
# ==============================
app.jwt.secret=CraveDashSuperSecretKeyForJWT2026Project123456789
app.jwt.expiration=3600000


# ==============================
# Force Reactive Gateway
# ==============================
spring.main.web-application-type=reactive